services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kezek
      POSTGRES_USER: kezek
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Kezek}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kezek -d kezek"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_CUSTOMER_ORIGIN: ${CUSTOMER_ORIGIN:-http://127.0.0.1:8000}
        VITE_ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8000}
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DATABASE_URL: postgresql+psycopg://kezek:${POSTGRES_PASSWORD}@db:5432/kezek
      CUSTOMER_ORIGIN: ${CUSTOMER_ORIGIN:-http://127.0.0.1:8000}
      ADMIN_ORIGIN: ${ADMIN_ORIGIN:-http://localhost:8000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${KEZEK_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  postgres-data:
