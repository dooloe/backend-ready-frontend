AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Kezek single-host AWS deployment with its own PostgreSQL data and secret,
  CloudFront HTTPS edge, and origin ingress limited to AWS CloudFront ranges.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t4g.small, t4g.medium]
    Description: A small host is needed to build the Docker image; verify this size is allowed by your AWS account plan.
  GitBranch:
    Type: String
    Default: main
    AllowedPattern: '^[A-Za-z0-9._/-]+$'
    Description: Public GitHub branch to deploy.
Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Kezek AWS PostgreSQL password, independent of Render credentials.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"kezek"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: "'\"@/\\ `:$,;"
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadKezekDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: kezek-aws-vpc}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: kezek-aws-igw}]
  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AppVpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: kezek-aws-public}]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      com.aws.cloudformation.Context:
        why: Restricts the web origin to CloudFront origin-facing servers; no SSH or database ingress.
        must:
          - Keep port 80 ingress sourced only from the CloudFront managed prefix list.
        mutable: change-with-constraints
    Properties:
      GroupDescription: CloudFront-only HTTP access to Kezek origin; no inbound SSH.
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: pl-3b927c52
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
  AppServer:
    Type: AWS::EC2::Instance
    Metadata:
      com.aws.cloudformation.Context:
        why: Single-host demo runtime; bootstraps the app and its separate PostgreSQL container from the deployment branch.
        must:
          - Keep the database password in Secrets Manager and the EBS root volume encrypted.
          - Expose the origin only through the CloudFront-scoped security group.
        mutable: change-with-constraints
    Properties:
      ImageId: !Sub
        - '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-${Arch}}}'
        - Arch: !If [IsArm, arm64, x86_64]
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PublicSubnet
      IamInstanceProfile: !Ref InstanceProfile
      SecurityGroupIds: [!GetAtt WebSecurityGroup.GroupId]
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      Tags:
        - Key: Name
          Value: kezek-aws
      UserData:
        Fn::Base64:
          Fn::Sub:
            - |
              #!/bin/bash
              set -eu
              exec > >(tee /var/log/kezek-bootstrap.log | logger -t kezek-bootstrap -s 2>/dev/console) 2>&1
              dnf update -y
              dnf install -y docker git jq
              systemctl enable --now docker
              mkdir -p /usr/local/lib/docker/cli-plugins
              curl -fL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${ComposeArch} -o /usr/local/lib/docker/cli-plugins/docker-compose
              chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
              git clone --depth 1 --branch '${GitBranch}' https://github.com/dooloe/backend-ready-frontend.git /opt/kezek
              secret_json=$(aws secretsmanager get-secret-value --secret-id '${SecretArn}' --query SecretString --output text --region '${AWS::Region}')
              db_password=$(printf '%s' "$secret_json" | jq -r .password)
              unset secret_json
              umask 077
              printf 'POSTGRES_PASSWORD=%s\nAPP_ENV=production\nSEED_DEMO_DATA=false\nCUSTOMER_ORIGIN=\nADMIN_ORIGIN=\nSESSION_COOKIE_SECURE=true\nKEZEK_PORT=80\n' "$db_password" > /opt/kezek/.env
              unset db_password
              cd /opt/kezek
              docker compose up -d --build
              cat > /etc/systemd/system/kezek-compose.service <<'UNIT'
              [Unit]
              Description=Kezek Docker Compose application
              Requires=docker.service
              After=docker.service
              [Service]
              Type=oneshot
              RemainAfterExit=yes
              WorkingDirectory=/opt/kezek
              ExecStart=/usr/bin/docker compose up -d
              ExecStop=/usr/bin/docker compose down
              [Install]
              WantedBy=multi-user.target
              UNIT
              systemctl enable kezek-compose.service
            - SecretArn: !Ref DatabaseSecret
              ComposeArch: !If [IsArm, aarch64, x86_64]
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Metadata:
      com.aws.cloudformation.Context:
        why: Provides the public HTTPS hostname and forwards uncached requests to the EC2 app origin.
        must:
          - Forward viewer Host, cookies, query strings, and CloudFront-Forwarded-Proto for same-origin sessions.
          - Keep caching disabled because API responses and staff sessions are personalized.
          - Redirect viewer HTTP to HTTPS.
        mutable: change-with-constraints
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} Kezek distribution'
        PriceClass: PriceClass_200
        HttpVersion: http2
        Origins:
          - Id: KezekEc2Origin
            DomainName: !GetAtt AppServer.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: KezekEc2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
Conditions:
  IsArm: !Or [!Equals [!Ref InstanceType, t4g.small], !Equals [!Ref InstanceType, t4g.medium]]
Outputs:
  ApplicationUrl:
    Description: Kezek customer and staff site (CloudFront HTTPS)
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  InstanceId:
    Value: !Ref AppServer
