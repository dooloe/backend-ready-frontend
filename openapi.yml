  /api/admin/analytics:
    get:
      operationId: getAnalytics
      summary: getAnalytics
      description: 'Same-organization issued-date cohort. Optional paired dateFrom/dateTo
        inclusive in organization IANA timezone, default both today; at most 31 local
        dates, dateFrom <= dateTo. Convert local midnight boundaries to UTC before
        filtering createdAt; include inactive services with history. Issued=count
        cohort, waiting/current waiting status, completed/current completed status.
        For completed cohort only: mean wait=(calledAt-createdAt), mean service=(completedAt-startedAt),
        minutes rounded to 1 decimal; null without valid samples. byService and byDay
        use identical cohort/filter. Missing/bad/reversed/oversized dates return 422.
        No customer identity/private token data.'
      x-required-roles:
      - admin
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analytics'
              examples:
                empty:
                  value:
                    dateFrom: '2026-10-20'
                    dateTo: '2026-10-20'
                    timezone: Asia/Almaty
                    issued: 0
                    waiting: 0
                    completed: 0
                    meanWaitMinutes: null
                    meanServiceMinutes: null
                    byService: []
                    byDay:
                    - date: '2026-10-20'
                      issued: 0
                      completed: 0
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Wrong role, organization or CSRF proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Wrong role, organization or CSRF proof
                    details: null
        '422':
          description: Invalid date range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid date range
                    details: null
      parameters:
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Supply both filters or neither; inclusive organization-local
          date.
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Supply both filters or neither; inclusive organization-local
          date.
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: &id008
          type: string
        message: *id008
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
      - code
      - message
      - details
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id008
        slug: *id008
        description: *id008
        timezone:
          type: string
