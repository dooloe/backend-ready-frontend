openapi: 3.0.3
info:
  title: Kezek planned MVP contract
  version: 1.0.0-design
  description: 'DESIGN CONTRACT: implemented incrementally in existing issues. Current
    running frontend contract remains openapi.yaml. This file specifies the planned
    organization/daily-queue/private-token/cookie API; presence here does not mean
    an endpoint is implemented. Lowercase lifecycle statuses; UTC timestamps, organization-local
    dates. No version segment under /api.'
servers:
- url: /
paths:
  /api/organizations:
    get:
      operationId: listOrganizations
      summary: List public organizations
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
  /api/organizations/{orgId}/services:
    get:
      operationId: listOrganizationServices
      summary: List active services with current organization-local queues
      security: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: &id002
                  value:
                    code: NOT_FOUND
                    message: Resource not found
                    details: null
  /api/queues/{queueId}/status:
    get:
      operationId: getQueueStatus
      summary: Read aggregate availability without private ticket or staff data
      security: []
      parameters:
      - name: queueId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Current counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummary'
              examples:
                noCapacity:
                  value:
                    id: queue-example
                    serviceId: service-example
                    queueDate: '2026-10-20'
                    isOpen: true
                    waiting: 2
                    activeCounters: 0
                    estimatedWaitMinutes: null
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: *id002
  /api/queues/{queueId}/tickets:
    post:
      operationId: issueTicket
      summary: Create or recover one anonymous daily ticket
      security: []
      parameters:
      - name: queueId
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id004
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Canonical base64url encoding of 32 cryptographically random
            bytes; server also checks canonical encoding.
        description: Independent secret scoped to this queue; send identical key/proof
          when retrying an uncertain response. See docs/ticket-issuance.md.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
              examples:
                created:
                  value:
                    ticket: &id003
                      id: ticket-example
                      queueId: queue-example
                      ticketNumber: A-001
                      serviceName: Registrar Office
                      status: waiting
                      position: 1
                      estimatedWaitMinutes: null
                      counterId: null
                      counterName: null
                      createdAt: '2026-10-20T07:00:00Z'
                      calledAt: null
                      startedAt: null
                      completedAt: null
                      cancelledAt: null
                      noShowAt: null
                    ticketUrl: /ticket/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache private links
        '200':
          description: 'Same queue/key and matching proof: same ticket, current status;
            no additional issuance event'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
              examples:
                duplicate:
                  value:
                    ticket: *id003
                    ticketUrl: /ticket/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache private links
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: *id002
        '409':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value:
                    code: QUEUE_CLOSED
                    message: This queue is closed
                    details: null
                retryConflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: Request conflicts with an earlier join
                    details: null
                tokenReused:
                  value:
                    code: TOKEN_REUSED
                    message: Token cannot be reused
                    details: null
        '422':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
        '503':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  value:
                    code: DATABASE_BUSY
                    message: Database busy; retry the request
                    details: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      description: Check matching persisted retry before availability/date. New closed/outdated
        queues reject; retries recover existing tickets after closure/midnight. Serialize
        issuance and enforce unique hashes/numbers. Never collect customer names or
        store raw proofs.
  /api/tickets/{token}:
    get:
      operationId: readPrivateTicket
      summary: Read ticket using access-token hash only
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: Authoritative private view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                waitingWithoutEstimate:
                  value: *id003
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken: &id005
                  value:
                    code: NOT_FOUND
                    message: Ticket not found
                    details: null
      description: 'No internal-ID fallback. Invalid/noncanonical tokens and unknown
        hashes give the same 404. Private response never echoes the access token;
        Cache-Control: no-store.'
  /api/tickets/{token}/cancel:
    post:
      operationId: cancelPrivateTicket
      summary: Cancel a waiting token-holder ticket and atomically append its event
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: Authoritative private view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                waitingWithoutEstimate:
                  value: *id003
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken: *id005
        '409':
          description: Ticket is not waiting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notWaiting:
                  value:
                    code: INVALID_STATE
                    message: Only waiting tickets can be cancelled
                    details: null
      description: 'No internal-ID fallback. Invalid/noncanonical tokens and unknown
        hashes give the same 404. Private response never echoes the access token;
        Cache-Control: no-store.'
components:
  schemas:
    Error:
      type: object
      additionalProperties: false
      properties:
        code: &id006
          type: string
        message: *id006
        details:
          type: object
          additionalProperties: true
          nullable: true
      required:
      - code
      - message
      - details
    Organization:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        name: *id006
        slug: *id006
        description: *id006
        timezone:
          type: string
          example: Asia/Almaty
      required:
      - id
      - name
      - slug
      - description
      - timezone
    QueueSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        serviceId: *id001
        queueDate:
          type: string
          format: date
        isOpen:
          type: boolean
        waiting: &id007
          type: integer
          minimum: 0
        activeCounters: *id007
        estimatedWaitMinutes:
          type: integer
          minimum: 0
          nullable: true
      required:
      - id
      - serviceId
      - queueDate
      - isOpen
      - waiting
      - activeCounters
      - estimatedWaitMinutes
    ServiceSummary:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        organizationId: *id001
        name: *id006
        description: *id006
        prefix: *id006
        durationMinutes:
          type: number
          exclusiveMinimum: true
          minimum: 0
        opensAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        closesAt:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        timezone: *id006
        queue:
          $ref: '#/components/schemas/QueueSummary'
      required:
      - id
      - organizationId
      - name
      - description
      - prefix
      - durationMinutes
      - opensAt
      - closesAt
      - timezone
      - queue
    Ticket:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        queueId: *id001
        ticketNumber: *id006
        serviceName: *id006
        status:
          type: string
          enum:
          - waiting
          - called
          - serving
          - completed
          - cancelled
          - no_show
        position:
          type: integer
          minimum: 1
          nullable: true
        estimatedWaitMinutes:
          type: integer
          minimum: 0
          nullable: true
        counterId: &id008
          type: string
          nullable: true
        counterName: *id008
        createdAt:
          type: string
          format: date-time
        calledAt:
          type: string
          format: date-time
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        noShowAt:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - queueId
      - ticketNumber
      - serviceName
      - status
      - position
      - estimatedWaitMinutes
      - counterId
      - counterName
      - createdAt
      - calledAt
      - startedAt
      - completedAt
      - cancelledAt
      - noShowAt
    JoinRequest:
      type: object
      additionalProperties: false
      properties:
        accessToken: *id004
      required:
      - accessToken
    JoinResponse:
      type: object
      additionalProperties: false
      properties:
        ticket:
          $ref: '#/components/schemas/Ticket'
        ticketUrl:
          type: string
          description: Private /ticket/{accessToken} URL constructed only from the
            supplied proof; never persisted.
      required:
      - ticket
      - ticketUrl
