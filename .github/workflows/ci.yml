name: Kezek CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, backend, migrations, and browser workflows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install pinned backend dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install --disable-pip-version-check -r backend/requirements-dev.txt

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Apply fresh migrations and check model drift
        env:
          DATABASE_URL: sqlite:///${{ runner.temp }}/kezek-ci-migrations.sqlite
        run: |
          backend/.venv/bin/alembic -c backend/alembic.ini upgrade head
          backend/.venv/bin/alembic -c backend/alembic.ini check

      - name: Compile backend modules
        run: >-
          backend/.venv/bin/python -m compileall -q
          backend/app backend/migrations backend/seed_directory.py backend/e2e_server.py

      - name: Check documented and generated OpenAPI contracts
        run: >-
          backend/.venv/bin/python -m pytest
          backend/tests/test_api.py
          -k "every_operation_and_response_matches_contract or generated_routes_and_security_match_contract"
          -q -p no:cacheprovider

      - name: Test backend
        run: backend/.venv/bin/python -m pytest backend/tests -q -p no:cacheprovider

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real-backend desktop and mobile workflows
        working-directory: frontend
        run: npm run test:e2e
