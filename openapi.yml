    SessionCookie:
      type: apiKey
      in: cookie
      name: kezek_session
      description: Opaque 8-hour session, hash-only storage. HttpOnly; SameSite=Lax;
        Path=/api; Secure under HTTPS. No browser bearer/localStorage session.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Session-bound synchronizer proof returned by login or authenticated
        GET /api/auth/csrf. Required with cookie on protected mutations; never in
        URLs.
