openapi: 3.0.3
info:
  title: Kezek planned MVP contract
  version: 1.0.0-design
  description: 'DESIGN CONTRACT: implemented incrementally in existing issues. Current
    running frontend contract remains openapi.yaml. This file specifies the planned
    organization/daily-queue/private-token/cookie API; presence here does not mean
    an endpoint is implemented. Lowercase lifecycle statuses; UTC timestamps, organization-local
    dates. No version segment under /api.'
servers:
- url: /
paths:
  /api/organizations:
    get:
      operationId: listOrganizations
      summary: List public organizations
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
  /api/organizations/{orgId}/services:
    get:
      operationId: listOrganizationServices
      summary: List active services with current organization-local queues
      security: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema: &id001
          type: string
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceSummary'
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: &id002
                  value:
                    code: NOT_FOUND
                    message: Resource not found
                    details: null
  /api/queues/{queueId}/status:
    get:
      operationId: getQueueStatus
      summary: Read aggregate availability without private ticket or staff data
      security: []
      parameters:
      - name: queueId
        in: path
        required: true
        schema: *id001
      responses:
        '200':
          description: Current counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSummary'
              examples:
                noCapacity:
                  value:
                    id: queue-example
                    serviceId: service-example
                    queueDate: '2026-10-20'
                    isOpen: true
                    waiting: 2
                    activeCounters: 0
                    estimatedWaitMinutes: null
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: *id002
  /api/queues/{queueId}/tickets:
    post:
      operationId: issueTicket
      summary: Create or recover one anonymous daily ticket
      security: []
      parameters:
      - name: queueId
        in: path
        required: true
        schema: *id001
      - name: Idempotency-Key
        in: header
        required: true
        schema: &id004
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: Canonical base64url encoding of 32 cryptographically random
            bytes; server also checks canonical encoding.
        description: Independent secret scoped to this queue; send identical key/proof
          when retrying an uncertain response. See docs/ticket-issuance.md.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
              examples:
                created:
                  value:
                    ticket: &id003
                      id: ticket-example
                      queueId: queue-example
                      ticketNumber: A-001
                      serviceName: Registrar Office
                      status: waiting
                      position: 1
                      estimatedWaitMinutes: null
                      counterId: null
                      counterName: null
                      createdAt: '2026-10-20T07:00:00Z'
                      calledAt: null
                      startedAt: null
                      completedAt: null
                      cancelledAt: null
                      noShowAt: null
                    ticketUrl: /ticket/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache private links
        '200':
          description: 'Same queue/key and matching proof: same ticket, current status;
            no additional issuance event'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinResponse'
              examples:
                duplicate:
                  value:
                    ticket: *id003
                    ticketUrl: /ticket/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
              description: Do not cache private links
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notFound: *id002
        '409':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                closed:
                  value:
                    code: QUEUE_CLOSED
                    message: This queue is closed
                    details: null
                retryConflict:
                  value:
                    code: IDEMPOTENCY_CONFLICT
                    message: Request conflicts with an earlier join
                    details: null
                tokenReused:
                  value:
                    code: TOKEN_REUSED
                    message: Token cannot be reused
                    details: null
        '422':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
        '503':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                busy:
                  value:
                    code: DATABASE_BUSY
                    message: Database busy; retry the request
                    details: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      description: Check matching persisted retry before availability/date. New closed/outdated
        queues reject; retries recover existing tickets after closure/midnight. Serialize
        issuance and enforce unique hashes/numbers. Never collect customer names or
        store raw proofs.
  /api/tickets/{token}:
    get:
      operationId: readPrivateTicket
      summary: Read ticket using access-token hash only
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: Authoritative private view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                waitingWithoutEstimate:
                  value: *id003
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken: &id005
                  value:
                    code: NOT_FOUND
                    message: Ticket not found
                    details: null
      description: 'No internal-ID fallback. Invalid/noncanonical tokens and unknown
        hashes give the same 404. Private response never echoes the access token;
        Cache-Control: no-store.'
  /api/tickets/{token}/cancel:
    post:
      operationId: cancelPrivateTicket
      summary: Cancel a waiting token-holder ticket and atomically append its event
      security: []
      parameters:
      - name: token
        in: path
        required: true
        schema: *id004
      responses:
        '200':
          description: Authoritative private view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
              examples:
                waitingWithoutEstimate:
                  value: *id003
        '404':
          description: Safe structured error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalidToken: *id005
        '409':
          description: Ticket is not waiting
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                notWaiting:
                  value:
                    code: INVALID_STATE
                    message: Only waiting tickets can be cancelled
                    details: null
      description: 'No internal-ID fallback. Invalid/noncanonical tokens and unknown
        hashes give the same 404. Private response never echoes the access token;
        Cache-Control: no-store.'
  /api/auth/login:
    post:
      operationId: loginSession
      summary: Authenticate active staff/admin and set cookie
      description: No bearer response. Reject untrusted browser Origin to prevent
        login CSRF. Verify Argon2id password; unknown/inactive/invalid credentials
        share a safe 401. Rotate any previous session. Session token and CSRF proof
        are independent; persist hashes only. Session expires after 8 hours, never
        sliding beyond expiry.
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionIdentity'
          headers:
            Set-Cookie:
              schema: &id011
                type: string
              description: kezek_session=<opaque>; Path=/api; HttpOnly; SameSite=Lax;
                Max-Age=28800; Secure when HTTPS. Development HTTP may omit Secure
                only in explicit development mode.
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_credentials:
                  value:
                    code: INVALID_CREDENTIALS
                    message: Invalid credentials
                    details: null
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /api/auth/logout:
    post:
      operationId: logoutSession
      summary: Invalidate persisted session and clear its cookie
      description: Requires the current CSRF proof. Delete the session hash, then
        expire cookie using the same Path/SameSite/Secure settings. Following requests
        get 401.
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '204':
          description: Session deleted; cookie expired; no body
  /api/auth/me:
    get:
      operationId: currentIdentity
      summary: Get active current user and organization
      description: Use credentialed fetch on page reload. Never expose password hashes,
        session hashes or raw session tokens.
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
  /api/auth/csrf:
    get:
      operationId: sessionCsrf
      summary: Read/rotate session-bound CSRF proof
      description: Authenticated cookie required. Return the current/rotated proof
        with no-store; store only its hash. Client obtains a fresh proof after reload;
        stale proof may require refresh and explicit retry. No user mutation is performed
        by GET.
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfProof'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
  /api/staff/queues:
    get:
      operationId: listStaffQueues
      summary: List active assigned counters with eligible service queues
      description: Staff see only same-organization active assigned counters and active
        supported services. Admins may operate all active counters in their organization.
        Empty assignments return []. Each counter has at most one current called/serving
        ticket. Closed queues with outstanding work remain operable.
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffCounterQueue'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
      x-required-roles:
      - staff
      - admin
  /api/staff/queues/{queueId}/call-next:
    post:
      operationId: callNextTicket
      summary: Atomically assign oldest waiting ticket at an authorized idle counter
      description: Validate current user organization, active counter and staff assignment
        plus supported service before mutable reads. Serialize the transaction. FIFO
        by creation timestamp then sequence. Save called timestamp, claim and actor
        event atomically. Closed queues allow outstanding work. Empty queue returns
        literal JSON null with 200.
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NullableTicket'
              examples:
                empty:
                  value: null
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '404':
          description: Queue not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    code: NOT_FOUND
                    message: Queue not found
                    details: null
        '409':
          description: Finish the current ticket first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                counter_busy:
                  value:
                    code: COUNTER_BUSY
                    message: Finish the current ticket first
                    details: null
                inactive:
                  value:
                    code: COUNTER_INACTIVE
                    message: Counter is inactive
                    details: null
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
      x-required-roles:
      - staff
      - admin
      parameters:
      - name: queueId
        in: path
        required: true
        schema: &id006
          type: string
          minLength: 1
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterAction'
  /api/staff/tickets/{ticketId}/start:
    post:
      operationId: startTicket
      summary: Transition called -> serving
      description: Require active actor and same-organization assigned counter owning
        this active ticket; admins remain organization-scoped. Only called -> serving
        is allowed. Persist actor event and appropriate UTC timestamp in one transaction;
        terminal state releases claim. Reject wrong-counter/cross-organization access;
        no called-to-completed shortcut.
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    code: NOT_FOUND
                    message: Ticket not found
                    details: null
        '409':
          description: Ticket cannot perform this transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_state:
                  value:
                    code: INVALID_STATE
                    message: Ticket cannot perform this transition
                    details: null
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
      x-required-roles:
      - staff
      - admin
      parameters:
      - name: ticketId
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterAction'
  /api/staff/tickets/{ticketId}/complete:
    post:
      operationId: finishTicket
      summary: Transition serving -> completed
      description: Require active actor and same-organization assigned counter owning
        this active ticket; admins remain organization-scoped. Only serving -> completed
        is allowed. Persist actor event and appropriate UTC timestamp in one transaction;
        terminal state releases claim. Reject wrong-counter/cross-organization access;
        no called-to-completed shortcut.
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    code: NOT_FOUND
                    message: Ticket not found
                    details: null
        '409':
          description: Ticket cannot perform this transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_state:
                  value:
                    code: INVALID_STATE
                    message: Ticket cannot perform this transition
                    details: null
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
      x-required-roles:
      - staff
      - admin
      parameters:
      - name: ticketId
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterAction'
  /api/staff/tickets/{ticketId}/no-show:
    post:
      operationId: noShowTicket
      summary: Transition called -> no_show
      description: Require active actor and same-organization assigned counter owning
        this active ticket; admins remain organization-scoped. Only called -> no_show
        is allowed. Persist actor event and appropriate UTC timestamp in one transaction;
        terminal state releases claim. Reject wrong-counter/cross-organization access;
        no called-to-completed shortcut.
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Invalid CSRF proof, origin, role or assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Invalid CSRF proof, origin, role or assignment
                    details: null
        '404':
          description: Ticket not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    code: NOT_FOUND
                    message: Ticket not found
                    details: null
        '409':
          description: Ticket cannot perform this transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                invalid_state:
                  value:
                    code: INVALID_STATE
                    message: Ticket cannot perform this transition
                    details: null
        '422':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                validation_error:
                  value:
                    code: VALIDATION_ERROR
                    message: Invalid request
                    details: null
      x-required-roles:
      - staff
      - admin
      parameters:
      - name: ticketId
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CounterAction'
  /api/admin/services:
    get:
      operationId: listAdminServices
      summary: listAdminServices
      description: List actor organization records, including inactive records for
        configuration. Never include password or session hashes.
      x-required-roles:
      - admin
      security:
      - SessionCookie: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Wrong role, organization or CSRF proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Wrong role, organization or CSRF proof
                    details: null
    post:
      operationId: createAdminServices
      summary: createAdminServices
      description: 'Infer organization from authenticated admin; never accept organization
        override. Reject references to another organization. Save atomically. Require
        opensAt < closesAt: overnight/equal schedules are unsupported and rejected.
        Prefix changes affect future daily queues only; freeze number prefix per existing
        queue. Schedule changes affect availability immediately without hiding outstanding
        work. Reject deactivation while active work exists.'
      x-required-roles:
      - admin
      security:
      - SessionCookie: []
        CsrfHeader: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '401':
          description: Sign in required or session expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_authenticated:
                  value:
                    code: NOT_AUTHENTICATED
                    message: Sign in required or session expired
                    details: null
        '403':
          description: Wrong role, organization or CSRF proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                forbidden:
                  value:
                    code: FORBIDDEN
                    message: Wrong role, organization or CSRF proof
                    details: null
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                not_found:
                  value:
                    code: NOT_FOUND
                    message: Resource not found
                    details: null
        '409':
          description: Configuration change conflicts with active work
          content:
            application/json:
              schema:
